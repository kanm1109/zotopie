name                  = "zotopie"
compatibility_date    = "2024-11-01"
pages_build_output_dir = "dist"

# ── D1 Database ────────────────────────────────────────────────────────────────
# Local dev: wrangler creates a local SQLite automatically (no real ID needed).
# Production: replace database_id with the real ID from:
#   wrangler d1 create zotopie-clicks
[[d1_databases]]
binding       = "DB"
database_name = "zotopie-clicks"
database_id   = "4ca5656e-8bab-4d14-a7e3-836f3b278df4"

# ── Environment variables ──────────────────────────────────────────────────────
# STATS_KEY is stored as an encrypted CF Pages secret (not here).
# Local dev: set STATS_KEY in a .env file or pass inline to wrangler pages dev.
# Production: already configured via `wrangler pages secret put STATS_KEY`.

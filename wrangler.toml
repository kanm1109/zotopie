name                  = "zotopie"
compatibility_date    = "2024-11-01"
pages_build_output_dir = "dist"

# ── D1 Database ────────────────────────────────────────────────────────────────
# Local dev: wrangler creates a local SQLite automatically (no real ID needed).
# Production: replace database_id with the real ID from:
#   wrangler d1 create zotopie-clicks
[[d1_databases]]
binding       = "DB"
database_name = "zotopie-clicks"
database_id   = "00000000-0000-0000-0000-000000000000"

# ── Environment variables ──────────────────────────────────────────────────────
# STATS_KEY: secret for the internal /api/clicks endpoint.
# Override in Cloudflare dashboard → Pages → Settings → Environment variables.
[vars]
STATS_KEY = "dev-key-change-before-deploy"

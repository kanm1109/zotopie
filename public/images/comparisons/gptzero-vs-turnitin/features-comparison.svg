<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="900" height="500" fill="#F8F9FB" rx="12"/>
  <rect x="0" y="0" width="900" height="56" fill="#7C3AED" rx="12"/>
  <rect x="0" y="44" width="900" height="12" fill="#7C3AED"/>
  <text x="450" y="34" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">GPTZero vs Turnitin — Feature Comparison</text>

  <!-- Column headers -->
  <rect x="24" y="72" width="340" height="36" fill="#F5F3FF" rx="6"/>
  <text x="194" y="95" text-anchor="middle" fill="#374151" font-size="12" font-weight="600">Feature</text>
  <rect x="372" y="72" width="220" height="36" fill="#EDE9FE" rx="6"/>
  <text x="482" y="95" text-anchor="middle" fill="#7C3AED" font-size="13" font-weight="700">GPTZero</text>
  <rect x="600" y="72" width="276" height="36" fill="#DBEAFE" rx="6"/>
  <text x="738" y="95" text-anchor="middle" fill="#1D4ED8" font-size="13" font-weight="700">Turnitin</text>

  <!-- Row data -->
  <!-- Row 1 -->
  <rect x="24" y="116" width="852" height="36" fill="#fff" rx="4"/>
  <text x="44" y="139" fill="#374151" font-size="12">Sentence-level AI highlighting</text>
  <text x="482" y="139" text-anchor="middle" fill="#059669" font-size="18" font-weight="700">✓</text>
  <text x="738" y="139" text-anchor="middle" fill="#D1D5DB" font-size="18">—</text>

  <!-- Row 2 -->
  <rect x="24" y="158" width="852" height="36" fill="#F9FAFB" rx="4"/>
  <text x="44" y="181" fill="#374151" font-size="12">Free access tier</text>
  <text x="482" y="181" text-anchor="middle" fill="#059669" font-size="18" font-weight="700">✓</text>
  <text x="738" y="181" text-anchor="middle" fill="#DC2626" font-size="18" font-weight="700">✗</text>

  <!-- Row 3 -->
  <rect x="24" y="200" width="852" height="36" fill="#fff" rx="4"/>
  <text x="44" y="223" fill="#374151" font-size="12">Individual retail subscription</text>
  <text x="482" y="223" text-anchor="middle" fill="#059669" font-size="18" font-weight="700">✓</text>
  <text x="738" y="223" text-anchor="middle" fill="#DC2626" font-size="18" font-weight="700">✗</text>

  <!-- Row 4 -->
  <rect x="24" y="242" width="852" height="36" fill="#F9FAFB" rx="4"/>
  <text x="44" y="265" fill="#374151" font-size="12">Native LMS embedding (Canvas, Moodle)</text>
  <text x="482" y="265" text-anchor="middle" fill="#D97706" font-size="12" font-weight="600">Partial</text>
  <text x="738" y="265" text-anchor="middle" fill="#059669" font-size="18" font-weight="700">✓</text>

  <!-- Row 5 -->
  <rect x="24" y="284" width="852" height="36" fill="#fff" rx="4"/>
  <text x="44" y="307" fill="#374151" font-size="12">Private historical student paper archive</text>
  <text x="482" y="307" text-anchor="middle" fill="#DC2626" font-size="18" font-weight="700">✗</text>
  <text x="738" y="307" text-anchor="middle" fill="#059669" font-size="18" font-weight="700">✓</text>

  <!-- Row 6 -->
  <rect x="24" y="326" width="852" height="36" fill="#F9FAFB" rx="4"/>
  <text x="44" y="349" fill="#374151" font-size="12">Contract cheating / authorship forensics</text>
  <text x="482" y="349" text-anchor="middle" fill="#DC2626" font-size="18" font-weight="700">✗</text>
  <text x="738" y="349" text-anchor="middle" fill="#059669" font-size="18" font-weight="700">✓</text>

  <!-- Row 7 -->
  <rect x="24" y="368" width="852" height="36" fill="#fff" rx="4"/>
  <text x="44" y="391" fill="#374151" font-size="12">False-positive minimization design</text>
  <text x="482" y="391" text-anchor="middle" fill="#059669" font-size="18" font-weight="700">✓</text>
  <text x="738" y="391" text-anchor="middle" fill="#D97706" font-size="12" font-weight="600">Moderate</text>

  <!-- Row 8 -->
  <rect x="24" y="410" width="852" height="36" fill="#F9FAFB" rx="4"/>
  <text x="44" y="433" fill="#374151" font-size="12">Open developer API</text>
  <text x="482" y="433" text-anchor="middle" fill="#059669" font-size="18" font-weight="700">✓</text>
  <text x="738" y="433" text-anchor="middle" fill="#D97706" font-size="12" font-weight="600">Partners only</text>

  <!-- Bottom labels -->
  <rect x="372" y="452" width="220" height="32" fill="#7C3AED" rx="6"/>
  <text x="482" y="472" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Best for Individuals</text>
  <rect x="600" y="452" width="276" height="32" fill="#1D4ED8" rx="6"/>
  <text x="738" y="472" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Best for Institutions</text>
</svg>

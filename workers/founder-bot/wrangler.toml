name = "zotopie-founder-bot"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── KV Namespace ──────────────────────────────────────────────────────────────
# After running: wrangler kv:namespace create "BOT_KV"
# Replace the id values below with the output from that command.
[[kv_namespaces]]
binding = "BOT_KV"
id = "fa7343f475844c56b7cd488665837b73"
preview_id = "0321c279cb4b42e69b1479a7ca8dcb29"

# ── Cron trigger — post-deploy health verification ────────────────────────────
[triggers]
crons = ["* * * * *"]

# ── Secrets (DO NOT put values here — set via CLI) ────────────────────────────
# wrangler secret put BOT_TOKEN
# wrangler secret put FOUNDER_CHAT_ID
# wrangler secret put BOT_SECRET
# wrangler secret put DEPLOY_HOOK_URL
